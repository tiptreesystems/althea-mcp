[project]
name = "althea-mcp"
version = "0.1.0"
description = "Bring your personal Althea into MCP-compatible AI tools."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Tiptree Advanced Systems Corporation", email = "martin@tiptreesystems.com" },
]
keywords = [
    "althea",
    "ai-agent",
    "mcp",
    "model-context-protocol",
    "personal-agent",
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27.0",
    "mcp>=1.28.1,<2",
    "pydantic>=2.7,<3",
]

[project.urls]
Homepage = "https://althea.tiptreesystems.com"
Repository = "https://github.com/tiptreesystems/althea-mcp"

[project.scripts]
althea-mcp = "althea_mcp.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["althea_mcp"]

[tool.setuptools.package-data]
althea_mcp = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "S", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]
